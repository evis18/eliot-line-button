<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TS Eliot Line Quiz</title>
    <link rel="stylesheet" href="styles.css?v=games-2">
  </head>
  <body>
    <main class="page">
      <section class="poem-panel" aria-labelledby="page-title">
        <p class="kicker">T. S. Eliot line quiz</p>
        <h1 id="page-title">TS Eliot Line Quiz</h1>
        <div class="game-bar" aria-live="polite">
          <p id="game-progress">Question 1 of 5</p>
          <p id="game-score">Score 0/5</p>
        </div>
        <blockquote id="poem-line" class="poem-line">
          Let us go then, you and I
        </blockquote>
        <p id="poem-source" class="source">"The Love Song of J. Alfred Prufrock"</p>
        <section class="choice-panel" aria-labelledby="choice-title">
          <p id="choice-title" class="choice-title">Which line comes next?</p>
          <div id="choice-list" class="choice-list"></div>
          <p id="answer-feedback" class="answer-feedback" aria-live="polite"></p>
        </section>
        <div class="game-actions">
          <button id="line-button" type="button">Next question</button>
          <button id="new-game-button" class="secondary-button" type="button">New game</button>
        </div>
        <section id="game-summary" class="game-summary" aria-live="polite" hidden>
          <p id="summary-score"></p>
          <button id="replay-current-button" class="secondary-button" type="button">Replay this game</button>
        </section>
        <section id="stanza-panel" class="stanza-panel" aria-live="polite" hidden>
          <div class="stanza-heading">
            <p class="stanza-label">Stanza</p>
            <a id="stanza-source-link" href="https://www.gutenberg.org/ebooks/1567" target="_blank" rel="noreferrer">
              Open source
            </a>
          </div>
          <div id="stanza-lines" class="stanza-lines"></div>
        </section>
        <section class="history-panel" aria-labelledby="history-title">
          <div class="history-heading">
            <p id="history-title" class="history-title">Past games</p>
            <button id="clear-history-button" class="text-button" type="button">Clear</button>
          </div>
          <div id="history-list" class="history-list"></div>
        </section>
        <p class="credit">
          Lines from Project Gutenberg public-domain editions:
          <a href="https://www.gutenberg.org/ebooks/1567" target="_blank" rel="noreferrer">
            Poems
          </a>
          and
          <a href="https://www.gutenberg.org/ebooks/1321" target="_blank" rel="noreferrer">
            The Waste Land
          </a>.
        </p>
      </section>
    </main>
    <script src="lines-data.js?v=games-2"></script>
    <script src="script.js?v=games-2"></script>
  </body>
</html>
