<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TS Eliot Line Quiz</title>
    <link rel="stylesheet" href="styles.css?v=quiz-1">
  </head>
  <body>
    <main class="page">
      <section class="poem-panel" aria-labelledby="page-title">
        <p class="kicker">T. S. Eliot line quiz</p>
        <h1 id="page-title">TS Eliot Line Quiz</h1>
        <blockquote id="poem-line" class="poem-line">
          Let us go then, you and I
        </blockquote>
        <p id="poem-source" class="source">"The Love Song of J. Alfred Prufrock"</p>
        <section class="choice-panel" aria-labelledby="choice-title">
          <p id="choice-title" class="choice-title">Which line comes next?</p>
          <div id="choice-list" class="choice-list"></div>
          <p id="answer-feedback" class="answer-feedback" aria-live="polite"></p>
        </section>
        <button id="line-button" type="button">Show another line</button>
        <section id="stanza-panel" class="stanza-panel" aria-live="polite" hidden>
          <div class="stanza-heading">
            <p class="stanza-label">Stanza</p>
            <a id="stanza-source-link" href="https://www.gutenberg.org/ebooks/1567" target="_blank" rel="noreferrer">
              Open source
            </a>
          </div>
          <div id="stanza-lines" class="stanza-lines"></div>
        </section>
        <p class="credit">
          Lines from Project Gutenberg public-domain editions:
          <a href="https://www.gutenberg.org/ebooks/1567" target="_blank" rel="noreferrer">
            Poems
          </a>
          and
          <a href="https://www.gutenberg.org/ebooks/1321" target="_blank" rel="noreferrer">
            The Waste Land
          </a>.
        </p>
      </section>
    </main>
    <script src="lines-data.js?v=quiz-1"></script>
    <script src="script.js?v=quiz-1"></script>
  </body>
</html>
